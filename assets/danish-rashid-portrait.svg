<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="port-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081438" />
      <stop offset="65%" stop-color="#04091A" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="gold-accent-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background Circle -->
  <circle cx="160" cy="160" r="150" fill="url(#port-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Outer Concentric Glowing Orbit Rings -->
  <circle cx="160" cy="160" r="142" fill="none" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="160" cy="160" r="132" fill="none" stroke="url(#ring-grad-1)" stroke-width="3" filter="url(#cyan-glow)" />
  <circle cx="160" cy="160" r="122" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />

  <!-- Gold Cardinal Notches -->
  <g transform="translate(160, 160)">
    <polygon points="0,-146 3,-140 -3,-140" fill="url(#gold-accent-ring)" />
    <polygon points="0,146 3,140 -3,140" fill="url(#gold-accent-ring)" />
    <polygon points="-146,0 -140,3 -140,-3" fill="url(#gold-accent-ring)" />
    <polygon points="146,0 140,3 140,-3" fill="url(#gold-accent-ring)" />
  </g>

  <!-- Tech Core Glow Area -->
  <circle cx="160" cy="160" r="114" fill="#03081C" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.8" />

  <!-- Center Graphic: VIP Monogram & Tech Symbol -->
  <g transform="translate(160, 140)">
    <!-- Central Shield / Hexagon -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#00D2FF" fill-opacity="0.08" stroke="#00D2FF" stroke-width="1.5" />
    <!-- Monogram DR -->
    <text x="0" y="14" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DR</text>
    <text x="0" y="32" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">AI • FULL STACK</text>
  </g>

  <!-- Bottom Arch Badge -->
  <g transform="translate(160, 245)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#070E22" stroke="url(#gold-accent-ring)" stroke-width="1" />
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="1.2">✦ DANISH RASHID ✦</text>
  </g>
</svg>
