<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#081026" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E0F2FE" />
      <stop offset="75%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="60" r="100" fill="#00D2FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="750" cy="180" r="120" fill="#2563EB" opacity="0.10" filter="url(#glow)" />
  <circle cx="820" cy="50" r="80" fill="#F59E0B" opacity="0.06" filter="url(#glow)" />

  <!-- Glowing Top Border Line -->
  <rect x="0" y="0" width="900" height="3.5" rx="2" fill="url(#accent-grad)" />
  <!-- Glowing Bottom Accent Line -->
  <rect x="0" y="237" width="900" height="3" rx="1.5" fill="url(#accent-grad)" />

  <!-- VIP Badge -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#00D2FF" fill-opacity="0.12" stroke="#00D2FF" stroke-opacity="0.45" stroke-width="1" />
    <text x="120" y="17.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.8">✦ VIP ARCHITECT &amp; DEVELOPER ✦</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(645, 32)">
    <rect x="0" y="0" width="205" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="13" r="4.5" fill="#10B981" />
    <text x="32" y="17" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="0.6">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- Main Headline Name -->
  <text x="50" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#name-grad)" letter-spacing="2">DANISH RASHID</text>

  <!-- Professional Title Subheading -->
  <text x="52" y="156" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18.5" font-weight="700" fill="#60A5FA" letter-spacing="1.5">FULL STACK DEVELOPER <tspan fill="#F59E0B">✦</tspan> AI DEVELOPER</text>

  <!-- Tagline -->
  <text x="52" y="193" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.3">Building modern web experiences, intelligent AI solutions &amp; scalable digital products.</text>

  <!-- Subtle Corner Circuit Accent -->
  <path d="M 830 155 L 855 155 L 865 165 L 865 195" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
  <circle cx="830" cy="155" r="2.5" fill="#38BDF8" opacity="0.7" />
  <circle cx="865" cy="195" r="2.5" fill="#F59E0B" opacity="0.7" />
</svg>