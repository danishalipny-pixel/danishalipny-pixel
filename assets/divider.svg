<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 28" width="100%" height="28">
  <defs>
    <linearGradient id="div-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0" />
      <stop offset="15%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1" />
      <stop offset="65%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Left and Right Gradient Trace Lines -->
  <line x1="20" y1="14" x2="445" y2="14" stroke="url(#div-line-grad)" stroke-width="1.5" />
  <line x1="515" y1="14" x2="940" y2="14" stroke="url(#div-line-grad)" stroke-width="1.5" />

  <!-- Center Futuristic HUD Node -->
  <g transform="translate(480, 14)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="10" fill="#00D2FF" fill-opacity="0.1" stroke="#00D2FF" stroke-opacity="0.35" stroke-width="1" />
    <!-- Rotating Tech Diamond -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="url(#diamond-grad)" />
    <!-- Inner Core Dot -->
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    <!-- Flanking Accent Dots -->
    <circle cx="-20" cy="0" r="2" fill="#38BDF8" fill-opacity="0.7" />
    <circle cx="20" cy="0" r="2" fill="#F59E0B" fill-opacity="0.7" />
    <circle cx="-30" cy="0" r="1.2" fill="#2563EB" fill-opacity="0.5" />
    <circle cx="30" cy="0" r="1.2" fill="#7C3AED" fill-opacity="0.5" />
  </g>
</svg>